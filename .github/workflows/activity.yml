name: Refresh activity panel

# Weekly refresh: activity panel + merged PR count. One run takes well under a minute.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling (exact text layout for the plate)
        run: pip install --quiet fonttools brotli

      - name: Render assets/activity-*.svg
        env:
          # ACTIVITY_TOKEN: a read-only fine-grained token that can see the private
          # Next-Play-Games repos. Falls back to the built-in token (public data only).
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_activity.py

      - name: Update merged PR count
        continue-on-error: true   # never block the activity panel
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/update_pr_count.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg assets/plate-nextplay-*.svg scripts/build_assets.py README.md
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore: weekly refresh (activity panel, merged PR count)"
          git push
